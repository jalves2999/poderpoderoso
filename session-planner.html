<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Planejador de Sessão — Aether</title>
<link rel="stylesheet" href="style.css">
<style>
/* ── Reset & Base ────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--parchment);min-height:100vh;font-family:var(--font-heading)}

/* ── Toolbar ─────────────────────────────────────────────────── */
.sp-bar{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;border-bottom:2px solid var(--line);
  background:var(--parchment);position:sticky;top:0;z-index:40;
}
.sp-bar a{font-size:12px;color:var(--ink-soft);text-decoration:none}
.sp-bar-title{font-family:var(--font-heading);font-size:17px;color:var(--ink);flex:1}
.btn-add-session{
  padding:8px 14px;border:none;border-radius:6px;
  background:var(--gold);color:#fff;font-family:var(--font-heading);
  font-size:13px;cursor:pointer;white-space:nowrap;
}
.btn-add-session:active{filter:brightness(.9)}

/* ── Container principal ─────────────────────────────────────── */
.sp-wrap{max-width:780px;margin:0 auto;padding:14px}

/* ── Acordeão de sessão ──────────────────────────────────────── */
.session-block{
  border:1px solid var(--line);border-radius:10px;
  background:rgba(255,255,255,.3);margin-bottom:12px;overflow:hidden;
}
.session-head{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;cursor:pointer;user-select:none;
  background:rgba(156,122,60,.06);border-bottom:1px solid transparent;
  transition:background .12s;
}
.session-head:hover{background:rgba(156,122,60,.1)}
.session-block.open>.session-head{border-bottom-color:var(--line)}
.session-chevron{font-size:12px;color:var(--ink-soft);transition:transform .2s;flex-shrink:0}
.session-block.open>.session-head .session-chevron{transform:rotate(90deg)}
.session-name-input{
  flex:1;border:none;background:transparent;font-family:var(--font-heading);
  font-size:15px;color:var(--ink);outline:none;min-width:0;
}
.session-meta{font-size:11px;color:var(--ink-soft);flex-shrink:0;white-space:nowrap}
.btn-del-session{
  background:none;border:none;cursor:pointer;color:var(--ink-soft);
  font-size:17px;flex-shrink:0;padding:0 2px;opacity:.5;transition:opacity .15s;
}
.btn-del-session:hover{opacity:1;color:#c0392b}
.session-body{display:none;padding:12px 14px}
.session-block.open>.session-body{display:block}

/* ── Notas da sessão ─────────────────────────────────────────── */
.session-notes-input{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;
  background:rgba(255,255,255,.5);font-family:var(--font-heading);font-size:12px;
  color:var(--ink);resize:vertical;min-height:48px;margin-bottom:12px;outline:none;
}
.session-notes-input:focus{border-color:var(--gold)}

/* ── Botão "Adicionar local" ─────────────────────────────────── */
.btn-add-location{
  display:flex;align-items:center;gap:6px;
  padding:8px 12px;border:1px dashed var(--line);border-radius:6px;
  background:transparent;font-family:var(--font-heading);font-size:12px;
  color:var(--ink-soft);cursor:pointer;transition:.12s;margin-bottom:4px;
}
.btn-add-location:hover{border-color:var(--gold);color:var(--gold)}

/* ── Acordeão de local ───────────────────────────────────────── */
.location-block{
  border:1px solid var(--line);border-radius:8px;
  background:rgba(255,255,255,.25);margin-bottom:8px;overflow:hidden;
}
.location-head{
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;cursor:pointer;user-select:none;
  transition:background .12s;
}
.location-head:hover{background:rgba(0,0,0,.03)}
.location-block.open>.location-head{border-bottom:1px solid var(--line)}
.location-type-badge{
  font-size:10px;padding:2px 7px;border-radius:8px;
  font-family:var(--font-label);text-transform:uppercase;letter-spacing:.3px;
  flex-shrink:0;
}
.type-cidade   {background:rgba(39,174,96,.12);color:#1e8449}
.type-caminho  {background:rgba(243,156,18,.12);color:#9a6a00}
.type-caverna  {background:rgba(100,100,100,.12);color:#555}
.type-outro    {background:rgba(142,68,173,.12);color:#6a3a7a}
.location-name-input{
  flex:1;border:none;background:transparent;font-family:var(--font-heading);
  font-size:13px;color:var(--ink);outline:none;min-width:0;
}
.btn-del-location{
  background:none;border:none;cursor:pointer;color:var(--ink-soft);
  font-size:15px;flex-shrink:0;opacity:.4;
}
.btn-del-location:hover{opacity:1;color:#c0392b}
.location-body{display:none;padding:10px 12px}
.location-block.open>.location-body{display:block}

/* ── Seções dentro do local ──────────────────────────────────── */
.loc-section{margin-bottom:12px}
.loc-section-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:6px;
}
.loc-section-label{
  font-family:var(--font-label);font-size:10px;text-transform:uppercase;
  letter-spacing:.4px;color:var(--ink-soft);
}
.btn-loc-add{
  display:flex;align-items:center;gap:4px;
  padding:4px 9px;border:1px dashed var(--line);border-radius:5px;
  background:transparent;font-family:var(--font-heading);font-size:11px;
  color:var(--ink-soft);cursor:pointer;transition:.1s;
}
.btn-loc-add:hover{border-color:var(--gold);color:var(--gold)}

/* ── Cards NPC, Inimigo, Tesouro ─────────────────────────────── */
.entry-card{
  border:1px solid var(--line);border-radius:7px;
  background:rgba(255,255,255,.4);padding:9px 11px;
  margin-bottom:6px;position:relative;
}
.entry-card-head{display:flex;align-items:flex-start;gap:8px}
.entry-card-icon{font-size:18px;flex-shrink:0;line-height:1.2}
.entry-card-body{flex:1;min-width:0}
.entry-card-name{font-family:var(--font-heading);font-size:13px;color:var(--ink)}
.entry-card-sub{font-size:11px;color:var(--ink-soft);margin-top:2px;line-height:1.4}
.btn-del-entry{
  position:absolute;top:7px;right:7px;
  background:none;border:none;cursor:pointer;
  font-size:14px;color:var(--ink-soft);opacity:.4;padding:0;
}
.btn-del-entry:hover{opacity:1;color:#c0392b}

/* Check de marcação */
.entry-check{
  width:18px;height:18px;border-radius:4px;border:2px solid var(--line);
  background:transparent;flex-shrink:0;cursor:pointer;display:flex;
  align-items:center;justify-content:center;transition:.12s;margin-top:1px;
}
.entry-check.checked{background:var(--gold);border-color:var(--gold);color:#fff;font-size:11px}

/* Sub-itens de NPC (loja) e inimigo (drops) */
.entry-subitems{margin-top:8px;padding-top:6px;border-top:1px solid var(--line)}
.entry-subitem{
  display:flex;align-items:center;gap:6px;
  padding:4px 0;font-size:12px;color:var(--ink);border-bottom:1px solid rgba(0,0,0,.05);
}
.entry-subitem:last-child{border-bottom:none}
.entry-subitem-name{flex:1;font-family:var(--font-heading)}
.entry-subitem-price{
  font-family:var(--font-heading);font-size:12px;color:var(--gold);
  white-space:nowrap;
}
.btn-del-subitem{
  background:none;border:none;cursor:pointer;color:var(--ink-soft);
  font-size:13px;opacity:.4;padding:0;
}
.btn-del-subitem:hover{opacity:1;color:#c0392b}

/* ── Empty state ─────────────────────────────────────────────── */
.sp-empty{
  text-align:center;padding:48px 20px;color:var(--ink-soft);
}
.sp-empty-icon{font-size:48px;display:block;margin-bottom:12px}
.sp-empty p{font-size:14px;line-height:1.7;margin-bottom:16px}

/* ── Picker (modal busca) ────────────────────────────────────── */
.picker-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;
}
.picker-overlay.hidden{display:none}
.picker-modal{
  background:var(--parchment);border-radius:14px 14px 0 0;
  border:1px solid var(--line);width:100%;max-width:520px;
  max-height:85vh;display:flex;flex-direction:column;
  box-shadow:0 -4px 24px rgba(0,0,0,.2);
}
@media(min-width:600px){
  .picker-overlay{align-items:center}
  .picker-modal{border-radius:14px;max-height:75vh}
}
.picker-header{
  padding:12px 16px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;
}
.picker-title{font-family:var(--font-heading);font-size:15px;color:var(--ink);flex:1}
.picker-close{background:none;border:none;cursor:pointer;font-size:20px;color:var(--ink-soft)}
.picker-chips{
  display:flex;gap:5px;flex-wrap:wrap;
  padding:8px 12px;border-bottom:1px solid var(--line);
}
.picker-chip{
  padding:3px 10px;border-radius:10px;border:1px solid var(--line);
  background:transparent;font-size:11px;cursor:pointer;
  font-family:var(--font-heading);color:var(--ink-soft);transition:.1s;
}
.picker-chip.active{background:var(--gold);color:#fff;border-color:var(--gold)}
.picker-search-wrap{padding:8px 12px;border-bottom:1px solid var(--line)}
.picker-search{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;
  background:rgba(255,255,255,.7);font-family:var(--font-heading);font-size:14px;
  color:var(--ink);outline:none;
}
.picker-search:focus{border-color:var(--gold)}
.picker-list{flex:1;overflow-y:auto;padding:6px 8px;display:flex;flex-direction:column;gap:3px}
.picker-item{
  padding:9px 10px;border-radius:6px;border:1px solid transparent;
  cursor:pointer;display:flex;align-items:center;gap:9px;transition:.1s;
}
.picker-item:hover{background:rgba(156,122,60,.07);border-color:rgba(156,122,60,.2)}
.picker-item-icon{font-size:18px;flex-shrink:0}
.picker-item-body{flex:1;min-width:0}
.picker-item-name{font-family:var(--font-heading);font-size:13px;color:var(--ink)}
.picker-item-sub{font-size:11px;color:var(--ink-soft)}

/* Picker de preço */
.picker-price-row{
  padding:10px 12px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:8px;
}
.picker-price-input{
  flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:6px;
  background:rgba(255,255,255,.7);font-family:var(--font-heading);font-size:13px;
  color:var(--ink);outline:none;
}
.picker-price-input:focus{border-color:var(--gold)}
.btn-picker-confirm{
  padding:8px 14px;border:none;border-radius:6px;
  background:var(--gold);color:#fff;font-family:var(--font-heading);
  font-size:13px;cursor:pointer;white-space:nowrap;
}

/* ── Toast ───────────────────────────────────────────────────── */
#sp-toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:rgba(30,30,30,.9);color:#fff;padding:9px 16px;
  border-radius:18px;font-size:13px;z-index:999;
  transition:opacity .3s;opacity:0;pointer-events:none;
  max-width:90vw;text-align:center;
}
</style>
</head>
<body>

<!-- Toolbar -->
<div class="sp-bar">
  <a href="index.html">← Grimório</a>
  <span class="sp-bar-title">📋 Planejador de Sessão</span>
  <button class="btn-add-session" id="btn-add-session">+ Nova Sessão</button>
</div>

<div class="sp-wrap">
  <!-- Empty state -->
  <div class="sp-empty" id="sp-empty">
    <span class="sp-empty-icon">📋</span>
    <p>Nenhuma sessão ainda.<br>Crie a primeira e comece a organizar locais, NPCs, inimigos e tesouro.</p>
    <button class="btn-add-session" id="btn-add-session-empty">+ Nova Sessão</button>
  </div>

  <!-- Lista de sessões -->
  <div id="session-list"></div>
</div>

<!-- Picker Modal -->
<div class="picker-overlay hidden" id="picker-overlay">
  <div class="picker-modal">
    <div class="picker-header">
      <span class="picker-title" id="picker-title">Selecionar</span>
      <button class="picker-close" id="picker-close">✕</button>
    </div>
    <div class="picker-chips" id="picker-chips"></div>
    <div class="picker-search-wrap">
      <input class="picker-search" id="picker-search" type="text" placeholder="🔍 Buscar...">
    </div>
    <div class="picker-list" id="picker-list"></div>
    <!-- Linha de preço (só para itens de loja) -->
    <div class="picker-price-row" id="picker-price-row" style="display:none">
      <input class="picker-price-input" id="picker-price-input" type="text" placeholder="Preço (ex: 10 prata, 2 ouro...)">
      <button class="btn-picker-confirm" id="picker-confirm">Adicionar</button>
    </div>
  </div>
</div>

<div id="sp-toast"></div>

<script src="data.js"></script>
<script src="missions.js"></script>
<script src="session-planner.js"></script>
</body>
</html>
