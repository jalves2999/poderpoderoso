    ${(() => { const q = mestresDaMagia(m.id), ms = MISSOES.filter(x => (x.recompensas.magias || []).includes(m.id));
      return q.length || ms.length ? `<div class="fontes">${q.length ? `<b>Quem ensina:</b><br>${q.map(x => `${esc(x.ms.nome)} (${esc(x.ms.lugar)}): ${textoEnsino(m, x.e)}`).join('<br>')}` : ''}${q.length && ms.length ? '<br>' : ''}${ms.length ? `<b>Recompensa de missão:</b> ${ms.map(x => `<button class="nome-magia" data-missao-info="${x.id}">${esc(x.nome)}</button>`).join(', ')}` : ''}</div>` : ''; })()}
    ${marcada ? `<div class="usos-bloco"><div><b>Usos restantes:</b> <span class="usos-num${rest === 0 ? ' zerado' : ''}">${rest} de ${max}</span> <span class="nota">${USOS_POR[m.usos.por]}</span></div>
      <div class="botoes"><button class="btn" data-mg-usar="${m.id}"${rest === 0 ? ' disabled' : ''}>Usar</button>
      <button class="btn simples" data-mg-devolver="${m.id}"${rest >= max ? ' disabled' : ''}>Devolver 1 uso</button></div></div>` : ''}
    <div class="botoes" style="margin-top:14px">${marcada
      ? `<button class="btn simples" data-mg-remover="${m.id}">Tirar das magias equipadas</button>`
      : `<button class="btn lacre" data-mg-equipar="${m.id}"${cabe ? '' : ' disabled'}>${cabe ? `Equipar por ${c} slot${c > 1 ? 's' : ''}` : `Faltam ${r.slotsUsados + c - r.slots} slots`}</button>`}</div>
  </div>`;
}
function abrirMagia(id, origem){
  modalSlot = null; modalMagia = id; modalMon = null; modalVolta = origem || null;
  renderModalMagia();
  $('#modal-fundo').hidden = false;
  document.body.style.overflow = 'hidden';
  $('#modal-lista').scrollTop = 0;
  try { history.pushState({ modal:true }, ''); } catch(e) {}
  $('#fechar-modal').focus();
}
function acaoMagia(b){
  const id = b.dataset.mgUsar || b.dataset.mgDevolver || b.dataset.mgEquipar || b.dataset.mgRemover;
  const m = magia(id); if (!m) return false;
  const r = calcular(P);
  if (b.dataset.mgUsar) { if (usosRestantes(m, r) > 0) { P.usosMagia[id] = (P.usosMagia[id] || 0) + 1; toast(`${m.nome} usada`); } }
  else if (b.dataset.mgDevolver) { P.usosMagia[id] = Math.max(0, (P.usosMagia[id] || 0) - 1); if (!P.usosMagia[id]) delete P.usosMagia[id]; }
  else if (b.dataset.mgEquipar) { if (r.slotsUsados + custo(m) <= r.slots && !P.magias.includes(id)) { P.magias.push(id); toast(`${m.nome} equipada`); } }
  else if (b.dataset.mgRemover) { P.magias = P.magias.filter(x => x !== id); delete P.usosMagia[id]; toast(`${m.nome} removida`); }
  const y = window.scrollY; render(); window.scrollTo(0, y); renderModalMagia();
  return true;
}

/* ----- Status ----- */
let INFO = {};
function card(id, rotulo, valor, sub, explica, classe = ''){
  INFO[id] = { titulo: rotulo, html: explica };
  return `<button class="card${classe ? ' ' + classe : ''}" data-info="${id}">
    <span class="rot">${rotulo}</span><span class="val">${valor}</span>${sub ? `<span class="sub">${sub}</span>` : ''}</button>`;
}
function painel(titulo, cards, extra = '', classeGrade = ''){
  return `<section class="painel"><h2>${titulo}${extra}</h2><div class="cards${classeGrade ? ' ' + classeGrade : ''}">${cards.join('')}</div></section>`;
}

function textoAtaques(r){
  if (r.acoesAtaque === 0) return 'nenhum';
  if (r.turnosPorAtaque > 1) return `1 a cada ${r.turnosPorAtaque} turnos`;
  return String(r.ataquesFis);
}

function rStatus(){
  const r = calcular(P), A = r.A, n = r.n;
  INFO = {};
  let h = '';
  if (r.avisos.length) h += `<div class="avisos">${r.avisos.map(a => `<div class="aviso">${esc(a)}</div>`).join('')}</div>`;
  h += `<p class="dica">Toque num card para ver a conta completa.</p>`;

  const listaDF = r.partesDF.length ? r.partesDF.join(' + ') : 'nenhum item';
  const listaDM = r.partesDM.length ? r.partesDM.join(' + ') : 'nenhum item';

  // ----- Sobrevivência -----
  h += painel('Sobrevivência', [
    card('vida', 'Vida', fmt(r.vida), `CON ${A.CON} × ${r.cls.fatorVida} × nível ${n}${r.E.vida ? `, +${r.E.vida}` : ''}`,
      `<div class="formula">Vida = ${REGRAS.vidaBase} + CON × fator da classe × nível${r.E.vida ? ' + evolução' : ''}</div>
       ${REGRAS.vidaBase} + ${A.CON} × ${r.cls.fatorVida} × ${n}${r.E.vida ? ` + ${r.E.vida}` : ''} = <b>${fmt(r.vida)}</b>`, 'vida'),
    card('defd10', 'Chance de defesa', `${r.defesaD10} ou menos`, `${r.defesaD10 * 10}% no d10${r.escudo ? ', com escudo' : ''}`,
      `<p>Quando um ataque vem na sua direção, role 1d10: com resultado igual ou menor que o valor, você defende.</p>
       <div class="formula">Defesa = DEX + escudo (máximo ${REGRAS.defesaMaxD10})</div>
       DEX ${A.DEX}${r.falta ? ` − ${r.falta * REGRAS.penalidadeFOR.dex} (FOR abaixo do exigido pela arma)` : ''}` +
       (r.escudo ? ` + ${r.bonusEscudo} (${esc(r.escudo.nome)})` : '') + ` = ${r.defesaBruta}` +
       (r.defesaBruta > REGRAS.defesaMaxD10 ? `, limitado a ${REGRAS.defesaMaxD10} porque um 10 sempre falha` : '') +
       `<br>Resultado: defende com <b>${r.defesaD10} ou menos</b>.` +
       (r.escudo ? '' : `<p>Um escudo na mão secundária soma +1 (leve) ou +2 (pesado).</p>`)),
    card('df', 'Defesa física', fmt(r.defF), `${r.df} dos itens × CON ${A.CON} × ${r.mult}`,
      `<div class="formula">Defesa física = itens × CON × ⌈nível ÷ 2⌉</div>
       Itens: ${esc(listaDF)} = ${r.df}<br>${r.df} × ${A.CON} × ${r.mult} = <b>${fmt(r.defF)}</b>
       <p>É subtraída de cada ataque físico que você não conseguiu defender.</p>`),
    card('dm', 'Defesa mágica', fmt(r.defM), `${r.dm} dos itens × FDV ${A.FDV} × ${r.mult}`,
      `<div class="formula">Defesa mágica = itens × FDV × ⌈nível ÷ 2⌉</div>
       Itens: ${esc(listaDM)} = ${r.dm}<br>${r.dm} × ${A.FDV} × ${r.mult} = <b>${fmt(r.defM)}</b>
       <p>É subtraída de cada ataque mágico recebido.</p>`)
  ], '', 'q4');

  // ----- Ataque -----
  let expFis = `<div class="formula">Ataques físicos = AGI + evolução + arma muito leve − escudo pesado</div>AGI ${A.AGI}` +
    (r.E.acoesAtaque ? ` + ${r.E.acoesAtaque} (evolução)` : '') +
    (r.acoesExtra ? ` + ${r.acoesExtra} (arma ${r.cat.nome.toLowerCase()})` : '') +
    (r.perdaEscudo ? ` − ${r.perdaEscudo} (${esc(r.escudo.nome)})` : '') +
    ` = <b>${r.acoesAtaque}</b> ${r.acoesAtaque === 1 ? 'ação' : 'ações'} de ataque.<p>`;
  if (r.acoesAtaque === 0) expFis += 'Sem ações de ataque, você não ataca fisicamente neste turno.';
  else if (r.custoAtaque > 1 && r.turnosPorAtaque > 1) expFis += `${esc(r.arma.nome)} custa ${r.custoAtaque} ações por ataque. Com ${r.acoesAtaque} por turno, o ataque é preparado num turno e sai no seguinte.`;
  else if (r.custoAtaque > 1) expFis += `${esc(r.arma.nome)} custa ${r.custoAtaque} ações por ataque: ${r.acoesAtaque} ÷ ${r.custoAtaque} = <b>${r.ataquesFis}</b> ${r.ataquesFis === 1 ? 'ataque' : 'ataques'}${r.acoesAtaque % r.custoAtaque ? ', sobrando 1 ação' : ''}.`;
  else expFis += `Cada ataque com ${esc(r.arma.nome)} custa 1 ação: <b>${r.ataquesFis}</b> ${r.ataquesFis === 1 ? 'ataque' : 'ataques'} por turno.`;
  expFis += '</p>';

  h += painel('Ataque', [
    card('atqfis', 'Ataques físicos', textoAtaques(r), `por turno${r.custoAtaque > 1 ? ', 2 ações cada' : ''}`, expFis, r.acoesAtaque === 0 ? 'alerta' : ''),
    card('fis', 'Dano físico', `${r.dadosF}d10 × ${n}`, `${esc(r.arma.nome)}, por ataque`,
      `<div class="formula">Dano = (FOR${r.E.dadoFisico ? ' + dano natural' : ''} + dado da arma) d10 × nível</div>
       Arma: ${esc(r.arma.nome)} (${r.arma.dados || 0}d10)<br>(${A.FOR}${r.E.dadoFisico ? ` + ${r.E.dadoFisico}` : ''} + ${r.arma.dados || 0}) d10 × ${n} = <b>${r.dadosF}d10 × ${n}</b>
       <p>Some os dados, multiplique pelo nível e subtraia a defesa física do alvo em cada ataque.</p>`),
    card('atqmag', 'Ataques mágicos', r.ataquesMag, 'por turno (INT)',
      `<div class="formula">Ataques mágicos = INT</div>INT ${A.INT} = <b>${r.ataquesMag}</b> por turno.
       <p>Cada magia lançada gasta 1 ataque mágico. Os ataques mágicos são separados dos físicos.</p>`),
    card('mag', 'Dano mágico', `${r.dadosM}d10 × ${n}`, '+ dados da magia',
      `<div class="formula">Dano mágico = (INT${r.E.dadoMagico ? ' + poder mágico' : ''} + foco + dado da magia) d10 × nível</div>
       Sem a magia: (${A.INT}${r.E.dadoMagico ? ` + ${r.E.dadoMagico}` : ''} + ${r.B.dadoMagico}) d10 × ${n} = <b>${r.dadosM}d10 × ${n}</b>
       <p>Some os dados da magia usada. Veja cada uma na aba Magias.</p>`),
    card('crit', 'Crítico', `${r.crit}%`, `${r.faixaCrit === 1 ? '1' : `1 a ${r.faixaCrit}`} no d10, +${r.critBonus}%`,
      `<div class="formula">Role um d10 separado: ${r.faixaCrit === 1 ? 'resultado 1' : `resultado de 1 a ${r.faixaCrit}`} é crítico</div>
       PER ${A.PER}: ${A.PER >= REGRAS.perLimiarCritico ? `como é ${REGRAS.perLimiarCritico} ou mais, a faixa base é 1 a 2.` : `faixa base só no 1 (precisa de PER ${REGRAS.perLimiarCritico} para 1 a 2).`}` +
       (r.E.critFaixa ? `<br>Evolução: +${r.E.critFaixa} na faixa.` : '') +
       `<p>Bônus: ${REGRAS.critBonusBase}% base${r.fontes.critDano.length ? ` + ${esc(r.fontes.critDano.join(', '))}` : ''} = <b>+${r.critBonus}%</b>, aplicado no final do cálculo.</p>`),
    card('cura', 'Cura', `${r.dadosC}d10 × ${n}`, '+ dados da magia',
      `<div class="formula">Cura = (FDV + foco + dado da magia) d10 × nível</div>
       Sem a magia: (${A.FDV} + ${r.B.dadoCura}) d10 × ${n} = <b>${r.dadosC}d10 × ${n}</b>`)
  ]);

  // ----- Campo de batalha e recursos -----
  h += painel('Campo e recursos', [
    card('mov', 'Movimento', `${r.movimento} hex`, r.penCarga || r.falta ? 'reduzido' : `${REGRAS.movimentoBase} + AGI ${A.AGI}`,
      `<div class="formula">Movimento = ${REGRAS.movimentoBase} + AGI × ${REGRAS.movimentoPorAGI}${r.B.mov ? ' + itens' : ''}</div>
       ${REGRAS.movimentoBase} + ${A.AGI}${r.B.mov ? ` + ${r.B.mov}` : ''} = ${r.movBruto}` +
       (r.penCarga ? `<br>Sobrecarga: −${r.penCarga}` : '') + (r.falta ? `<br>FOR abaixo do exigido pela arma: −${r.falta * REGRAS.penalidadeFOR.movimento}` : '') +
       `<br>Resultado: <b>${r.movimento}</b> hexágonos (mínimo 1).`, r.penCarga || r.falta ? 'alerta' : ''),
    card('reacao', 'Reações', r.reacoes, 'por turno',
      `<div class="formula">Reações = ${REGRAS.reacoesBase} base + evolução de AGI</div>
       ${REGRAS.reacoesBase}${r.E.reacoes ? ` + ${r.E.reacoes}` : ''} = <b>${r.reacoes}</b>
       <p>Usadas por habilidades do tipo reação, fora do seu turno.</p>`),
    card('carga', 'Carga', `${fmt(r.peso)}/${fmt(r.carga)} kg`, r.excesso ? `sobrecarga de ${fmt(r.excesso)} kg` : 'dentro do limite',
      `<div class="formula">Carga = ${REGRAS.cargaBase} kg + FOR × ${REGRAS.cargaPorFOR} kg${r.B.carga ? ' + itens' : ''}${r.E.carga ? ' + evolução' : ''}</div>
       ${REGRAS.cargaBase} + ${A.FOR} × ${REGRAS.cargaPorFOR}${r.B.carga ? ` + ${r.B.carga}` : ''}${r.E.carga ? ` + ${r.E.carga}` : ''} = <b>${fmt(r.carga)} kg</b>
       <br>Peso equipado: ${fmt(r.peso)} kg.
       <p>Cada ${REGRAS.pesoPorPenalidade} kg acima da carga custa 1 hexágono de movimento.</p>`, r.excesso ? 'alerta' : ''),
    card('slots', 'Slots de magia', `${r.slotsUsados}/${r.slots}`, r.slotsUsados > r.slots ? 'excedido' : 'em uso',
      `<div class="formula">Slots = INT × ${REGRAS.slotsPorINT}${r.B.slots ? ' + itens' : ''}</div>
       ${A.INT} × ${REGRAS.slotsPorINT}${r.fontes.slots.length ? ` + ${esc(r.fontes.slots.join(', '))}` : ''} = <b>${r.slots}</b><br>Em uso: ${r.slotsUsados}.`,
      r.slotsUsados > r.slots ? 'alerta' : ''),
    card('recurso', r.cls.recurso, r.cls.recursoNoAlvo ? (k => `${k} ${k === 1 ? 'alvo' : 'alvos'}`)(P.alvos.filter(a => a.marcas > 0).length) : r.recursoMax != null ? `${r.recursoAtual}/${r.recursoMax}` : `+${r.E.recurso}`,
      r.cls.recursoNoAlvo ? `até ${r.recursoMax} por inimigo` : r.recursoMax != null ? 'atual / máximo' : 'recurso da classe',
      `<p>${esc(r.cls.recurso)} é o recurso que o ${r.cls.nome.toLowerCase()} gasta para usar habilidades.</p>` +
      (r.recursoMax != null
        ? `<div class="formula">Máximo${r.cls.recursoNoAlvo ? ' por inimigo' : ''} = ${r.cls.recursoBase} base + evolução de FDV + itens</div>${r.cls.recursoBase}${r.E.recurso ? ` + ${r.E.recurso}` : ''}${r.B.recurso ? ` + ${r.B.recurso} (${esc(r.fontes.recurso.join(', '))})` : ''} = <b>${r.recursoMax}</b>
           <p>${esc(r.cls.recursoRegra)}</p><button class="btn" data-ir="habilidades">Controlar ${esc(r.cls.recurso)}</button>`
        : `A evolução de FDV soma <b>+${r.E.recurso}</b>. A quantidade base será definida junto com as habilidades desta classe.`)),
    card('maestria', 'Maestria', r.E.maestria, r.E.maestria ? `−${r.E.maestria} no poder inimigo` : 'sem maestria',
      `<p>Cada bolinha de Maestria (evolução de DEX) tira 1 do poder de inimigos que não têm maestria.</p>Você tem <b>${r.E.maestria}</b>.`)
  ]);

  // ----- Atributos, testes e perícias -----
  const resta = r.totalEvo - r.gastos;
  INFO.evo = { titulo:'Pontos de evolução', html:
    `<div class="formula">Pontos = nível × ${REGRAS.evolucao.pontosPorNivel} + extras do mestre</div>
     ${n} × ${REGRAS.evolucao.pontosPorNivel}${P.pontosExtras ? ` + ${P.pontosExtras}` : ''} = ${fmt(r.totalEvo)}<br>Gastos: ${fmt(r.gastos)}<br>Disponíveis: <b>${fmt(resta)}</b>
     <br><button class="btn" data-ir="evolucao">Abrir Evolução</button>` };
  h += `<section class="painel"><h2>Atributos <button class="btn pequeno simples" data-info="evo">${fmt(resta)} pontos de evolução</button></h2><div class="attrs">` +
    ATRIBUTOS.map(a => {
      const t = r.E.teste[a.id] || 0, pe = r.E.pericia[a.id] || 0, bi = r.bonusAttr[a.id] || 0;
      INFO['attr-' + a.id] = { titulo: `${a.id}, ${a.nome}`, html:
        `<p>${esc(a.desc)}.</p>Valor distribuído: ${P.atributos[a.id]}${bi ? `<br>Itens: +${bi}` : ''}<br>Valor final: <b>${A[a.id]}</b>
         <br>Bônus em testes: ${t ? `+${t}` : 'nenhum'}<br>Bônus em perícias: ${pe ? `+${pe}` : 'nenhum'}
         <br>Peso na evolução: ${pesoAttr(a.id)}` };
      return `<button class="attr" data-info="attr-${a.id}"><span class="sig">${a.id}</span>
        <span class="v">${A[a.id]}${bi ? `<sup>+${bi}</sup>` : ''}</span>
        <span class="tp">${t ? `T+${t}` : ''}${t && pe ? '<br>' : ''}${pe ? `P+${pe}` : ''}</span></button>`;
    }).join('') +
    `</div><p class="legenda">T = bônus em testes, P = bônus em perícias, vindos da evolução.</p></section>`;

  // ----- Perícias equipadas -----
  const pEq = PERICIAS.filter(pc => P.periciasEquipadas.includes(pc.id));
  h += `<section class="painel"><h2>Perícias <button class="btn pequeno simples" data-abrir-pericias="1">${pEq.length} ${pEq.length === 1 ? 'equipada' : 'equipadas'} de ${P.pericias.length}</button></h2>` +
    (pEq.length ? `<div class="cards">${pEq.map(pc => { const bn = bonusPericia(pc, r);
      INFO['per-' + pc.id] = { titulo: esc(pc.nome), sub: `perícia de ${pc.attr}`, html: `<p>${esc(pc.descricao)}</p><div class="formula">+1 equipada${bn.evo ? ` + ${bn.evo} da evolução de ${pc.attr}` : ''} = +${bn.total}</div><p>Teste com ${realce(pc.attr)} ${r.A[pc.attr]}.</p><button class="btn simples" data-pericia-cat="${pc.id}">Ver no Compêndio</button>` };
      return `<button class="card" data-info="per-${pc.id}"><span class="rot">${esc(pc.nome)}</span><span class="val">+${bn.total}</span><span class="sub">${pc.attr} ${r.A[pc.attr]}</span></button>`; }).join('')}</div>`
      : '<p class="vazio">Nenhuma perícia equipada. Equipe na aba Habilidades › Perícias.</p>') + `</section>`;

  // ----- Habilidades -----
  const livres = r.pontosHab - r.pontosHabGastos;
  h += `<section class="bloco"><h2>Habilidades aprendidas <small>${livres} ${livres === 1 ? 'ponto livre' : 'pontos livres'}</small></h2><ul class="lista-hab">
    <li><b>${esc(r.cls.passiva.nome)}</b> <span>passiva de classe</span><br><span>${realce(esc(r.cls.passiva.texto))}</span></li>` +
    r.habilidades.map(hb => `<li><b>${esc(hb.nome)}</b> <span>${hb.categoria ? esc(hb.categoria.toLowerCase()) + ', ' : ''}${esc(hb.custo.toLowerCase())}${hb.recursoGasto ? `, ${esc(r.cls.recurso)} ${esc(hb.recursoGasto)}` : ''}, recarga ${esc(hb.recarga)}</span><br><span>${realce(esc(hb.efeito))}</span></li>`).join('') +
    `</ul>${r.habilidades.length ? '' : '<p class="vazio">Nenhuma habilidade aprendida ainda.</p>'}<button class="btn pequeno simples" data-ir="habilidades">Abrir habilidades</button></section>`;
  return h;
}

/* ----- Evolução ----- */
function rEvolucao(){
  const gasto = pontosGastos(), total = pontosTotais(), resta = total - gasto, max = REGRAS.evolucao.maxBolinhas;
  let h = `<div class="bolsa${resta < 0 ? ' negativo' : ''}"><div class="resta">${fmt(resta)}<small>pontos disponíveis</small></div>
    <div class="lado">${fmt(gasto)} gastos<br>de ${fmt(total)} no total</div></div>
    <section class="bloco"><h2>Pontos de evolução</h2>
      <p style="margin-top:0">Cada nível dá ${REGRAS.evolucao.pontosPorNivel} pontos: nível ${P.nivel} × ${REGRAS.evolucao.pontosPorNivel} = <b>${fmt(pontosPorNivel())}</b>.</p>
      <label for="evo-extras" style="font-weight:600;display:block;margin:8px 0 4px">Pontos extras dados pelo mestre</label>
      <div class="recebidos"><button class="selo" data-evo-pontos="-1" aria-label="Menos 1 ponto extra"${P.pontosExtras <= 0 ? ' disabled' : ''}>−</button>
      <input type="text" inputmode="numeric" id="evo-extras" value="${P.pontosExtras}">
      <button class="selo" data-evo-pontos="1" aria-label="Mais 1 ponto extra">+</button></div>
      <p class="nota">Total: ${fmt(pontosPorNivel())} do nível + ${fmt(P.pontosExtras)} extras = ${fmt(total)}.</p>
    </section>`;
  if (resta < 0) h += `<div class="aviso">Você gastou ${fmt(-resta)} pontos a mais do que tem. Desfaça alguma bolinha.</div>`;

  ATRIBUTOS.forEach(a => {
    const evs = EVOLUCOES.filter(ev => ev.attr === a.id); if (!evs.length) return;
    const v = P.atributos[a.id], peso = pesoAttr(a.id);
    h += `<section class="bloco"><h2>${a.id} ${esc(a.nome)} <small>valor ${v}, peso ${peso}</small></h2>`;
    evs.forEach(ev => {
      const k = P.evolucao[ev.id] || 0;
      const custos = Array.from({ length:max }, (_, i) => custoBolinha(ev, i));
      const prox = k < max ? custos[k] : null;
      const pode = prox !== null && prox <= resta;
      h += `<div class="evo">
        <div class="topo-evo"><span class="nome">${esc(ev.nome)}</span><span class="gasto">gasto ×${ev.gasto}</span></div>
        <div class="efeito">${realce(esc(ev.efeito))} por bolinha${ev.bonus.recurso ? ` (${esc(classe(P.classe).recurso)})` : ''}</div>

const LS_BATALHA = 'rpgHex_batalha';

function salvarBatalha(){ lsSet(LS_BATALHA, BATALHA); }
const monstro = id => MONSTROS.find(m => m.id === id) || null;
const filtroMon = { dif:'todos', tipo:'todos', origem:'todos', local:'todos', busca:'' };
const origemDe = m => ORIGENS[m.origem] ? m.origem : 'comum';
function tagOrigem(m){ const o = ORIGENS[origemDe(m)]; return origemDe(m) === 'comum' ? '' : `<span class="tag-dif" style="background:${o.cor}">${o.nome}</span>`; }

function estrelas(d){ return `<span class="estrelas" style="color:${DIFICULDADES[d].cor}" aria-label="Dificuldade ${d}">${'★'.repeat(d)}${'☆'.repeat(5 - d)}</span>`; }
function tagDif(d){ return `<span class="tag-dif" style="background:${DIFICULDADES[d].cor}">${d}, ${DIFICULDADES[d].nome}</span>`; }

function calcMonstro(mon, nivel, difN, pctVida){
  const n = clamp(nivel, 1, REGRAS.nivelMax), D = DIFICULDADES[difN] || DIFICULDADES[2], T = TAMANHOS[mon.tamanho], mult = Math.ceil(n / 2);
  const A = Object.assign({ FOR:1, CON:1, DEX:1, AGI:1, INT:1, FDV:1, PER:1 }, mon.atributos);
  // escala de atributos pela dificuldade escolhida (em relação à original do monstro)
  const passo = difN - (mon.dificuldade || difN), deltaA = {};
  if (passo) {
    const E = ESCALA_DIFICULDADE, conjurador = (mon.magias || []).length || (mon.ataques || []).some(a => a.tipo === 'magico');
    const soma = (k, v) => { const novo = Math.max(1, A[k] + v); deltaA[k] = novo - A[k]; A[k] = novo; };
    Object.entries(E.porPasso).forEach(([k, v]) => soma(k, v * passo));
    if (conjurador) soma('INT', E.intConjurador * passo);
    soma('PER', Math.trunc(passo / E.perACada));
  }
  const eq = mon.equip || {};
  const arma = eq.arma ? item(eq.arma) : null;
  const sec = eq.secundaria ? item(eq.secundaria) : null;
  const escudo = sec && ehEscudo(sec) ? sec : null;
  let df = (mon.defesaNatural || {}).df || 0, dm = (mon.defesaNatural || {}).dm || 0;
  ['elmo','peitoral','luvas','botas'].forEach(sl => { const it = item(eq[sl]); if (it) { df += it.df || 0; dm += it.dm || 0; } });
  if (passo) { const dp = ESCALA_DIFICULDADE.defesaPorPasso || { df: 0, dm: 0 }; df = Math.max(0, df + dp.df * passo); dm = Math.max(0, dm + dp.dm * passo); }
  const vida = Math.round((T.vidaBase + A.CON * T.fatorVida * n) * D.vida);
  // fases por porcentagem de vida (só quando a vida atual é informada)
  const fasesAtivas = pctVida == null ? [] : (mon.fases || []).filter(f => pctVida <= f.abaixoDe);
  const md = { ataques: 0, dados: 0, df: 1, dm: 1 };
  fasesAtivas.forEach(f => { const m = f.mod || {}; md.ataques += m.ataques || 0; md.dados += m.dados || 0; md.df *= m.df == null ? 1 : m.df; md.dm *= m.dm == null ? 1 : m.dm; });
  const defF = Math.round(df * A.CON * mult * D.defesa * md.df);
  const defM = Math.round(dm * A.FDV * mult * D.defesa * md.dm);
  const defD10 = Math.min(REGRAS.defesaMaxD10, A.DEX + (escudo ? escudo.defesa : 0));
  const cat = arma && !arma.foco ? CATEGORIAS_ARMA[arma.categoria] : CATEGORIAS_ARMA.desarmado;
  const acoes = Math.max(0, A.AGI + md.ataques + (cat.acoesExtra || 0) - (escudo ? escudo.perdeAcao || 0 : 0));
  const custoAt = cat.custo || 1;
  const ataquesTurno = acoes === 0 ? '0' : acoes >= custoAt ? String(Math.floor(acoes / custoAt)) : `1 a cada ${Math.ceil(custoAt / acoes)} turnos`;
  const bonusFoco = (arma && arma.bonus && arma.bonus.dadoMagico) || 0;
  const ataques = [];
  if (arma && !arma.foco) ataques.push({ nome: arma.nome, dados: Math.max(1, A.FOR + arma.dados + D.dano + md.dados), tipo:'fisico',
    alcance: arma.alcance > 1 ? `${arma.alcance} hex` : 'Adjacente', efeito: arma.efeito || '' });
  (mon.ataques || []).forEach(a => {
    const mag = a.tipo === 'magico';
    ataques.push({ nome: a.nome, dados: Math.max(1, (mag ? A.INT : A.FOR) + a.dados + D.dano + md.dados), tipo: mag ? 'magico' : 'fisico', alcance: a.alcance || 'Adjacente', efeito: a.efeito || '' });
  });
  if (!ataques.length) ataques.push({ nome:'Pancada', dados: Math.max(1, A.FOR + D.dano + md.dados), tipo:'fisico', alcance:'Adjacente', efeito:'' });
  const magias = (mon.magias || []).map(magia).filter(Boolean).map(m => ({ m,
    dados: m.calc === 'dano' ? `${Math.max(1, A.INT + bonusFoco + m.dado + D.dano)}d10 × ${n}` :
           m.calc === 'cura' ? `${A.FDV + m.dado}d10 × ${n}` : m.calc === 'absorve' ? `${A.FDV + m.dado}d10 × ${n}` : '' }));
  return { n, D, T, A, deltaA, passo, fasesAtivas, md, arma, escudo, df, dm, vida, defF, defM, defD10, ataquesTurno, ataques, magias,
    ataquesMag: magias.length ? A.INT + md.ataques : 0, crit: A.PER >= REGRAS.perLimiarCritico ? REGRAS.critComPER : REGRAS.critBase,
    movimento: REGRAS.movimentoBase + A.AGI * REGRAS.movimentoPorAGI + T.movimento, mult };
}

function resumoMon(mon){
  const atq = (mon.equip && mon.equip.arma && item(mon.equip.arma)) ? item(mon.equip.arma).nome : (mon.ataques && mon.ataques[0] ? mon.ataques[0].nome : 'Pancada');
  return `${mon.tipo}, ${TAMANHOS[mon.tamanho].nome.toLowerCase()}. ${atq}${mon.magias && mon.magias.length ? ', usa magias' : ''}${(mon.drops || []).length ? '' : ', sem drop'}`;
}

function textoDrop(dp){
  if (dp.item) { const it = item(dp.item); return it ? `${tierBadge(it.tier)} ${esc(it.nome)}` : esc(dp.item); }
  return realce(esc(dp.texto));
}

function textoMod(m){
  const p = [];
  if (m.ataques) p.push(`${m.ataques > 0 ? '+' : ''}${m.ataques} ação de ataque`);
  if (m.dados) p.push(`${m.dados > 0 ? '+' : ''}${m.dados}d10 nos ataques`);
  if (m.df != null && m.df !== 1) p.push(`DF ×${String(m.df).replace('.', ',')}`);
  if (m.dm != null && m.dm !== 1) p.push(`DM ×${String(m.dm).replace('.', ',')}`);
  return p.join(', ');
}

      <dt>Defesa mágica</dt><dd><b>${fmt(c.defM)}</b> <span class="nota">${c.dm} × FDV ${c.A.FDV} × ${c.mult} × ${c.D.defesa}</span></dd>

    <p class="nota">Dados = FOR (ou INT) + dado do ataque${c.D.dano > 0 ? ` + ${c.D.dano} da dificuldade` : c.D.dano < 0 ? ` − ${-c.D.dano} da dificuldade` : ''}, mínimo 1d10.</p>
    ${c.magias.length ? `<h3 class="sub-titulo">Magias</h3><ul class="lista-simples">${c.magias.map(x => `<li><b>${esc(x.m.nome)}:</b> ${realce(esc(x.m.resumo))}${x.dados ? `, ${realce(x.dados)}` : ''}; ${x.m.usos.qtd} ${USOS_POR[x.m.usos.por]}</li>`).join('')}</ul>` : ''}
    ${(mon.fases || []).length ? `<h3 class="sub-titulo">Fases de combate</h3><ol class="fases">${mon.fases.slice().sort((a, b) => b.abaixoDe - a.abaixoDe).map(f => `<li${c.fasesAtivas.includes(f) ? ' class="ativa"' : ''}><b>${f.abaixoDe >= 100 ? 'Desde o início' : `Abaixo de ${f.abaixoDe}%`}: ${esc(f.nome)}.</b> ${realce(esc(f.efeito))}${f.mod ? `<br><small>${textoMod(f.mod)}</small>` : ''}</li>`).join('')}</ol>` : ''}
    ${mon.habilidades && mon.habilidades.length ? `<h3 class="sub-titulo">Habilidades</h3><ul class="lista-simples">${mon.habilidades.map(hb => `<li><b>${esc(hb.nome)}</b> <span class="nota">${esc(hb.tipo.toLowerCase())}${hb.usos && hb.usos !== '—' ? `, ${esc(hb.usos)}` : ''}</span><br>${realce(esc(hb.efeito))}</li>`).join('')}</ul>` : ''}

  if (max < min) return `<div class="dados">${realce(`Precisa de pelo menos ${min} ${rec}; seu máximo é ${max}.`)}</div>`;
  if (hb.calc.tipo === 'dano')
    return `<div class="dados">${realce(`Com ${min} ${rec}: ${r.dadosF + k * min}d10 × ${r.n}. Com ${max}: ${r.dadosF + k * max}d10 × ${r.n}.`)}</div>`;

    return `<div class="dados">${realce(`Com ${min} ${rec}: ${k * min}d10 × ${r.n}. Com ${max}: ${k * max}d10 × ${r.n}.`)}</div>`;

    return `<div class="dados">${realce(`Com ${min} ${rec}: +${k * min}d10. Com ${max}: +${k * max}d10. Sua cura base é ${r.dadosC}d10 + o dado da magia, × ${r.n}.`)}</div>`;

    return `<div class="dados">${realce(`Com ${min} ${rec}: ${r.dadosC + k * min}d10 × ${r.n}. Com ${max}: ${r.dadosC + k * max}d10 × ${r.n}.`)}</div>`;

}

    <p class="intro">Aventuras prontas para conseguir itens, magias e perícias. Cada missão traz o NPC que a oferece, as etapas (com armadilhas, enigmas, bênçãos, maldições e inimigos raros), o chefe e as recompensas. As soluções dos enigmas ficam escondidas para o mestre.</p>
    ${painelFiltros('missoes', `<input type="search" id="busca-missoes" value="${esc(filtroMissoes.busca)}" placeholder="Buscar missão, NPC, lugar ou recompensa" aria-label="Buscar missões">`, [
      ['Região', chips('mis-reg', Object.assign({ todos:'Todas' }, ...REGIOES.map(r => ({ [r.id]: r.nome }))), filtroMissoes.regiao)],
      ['Dificuldade', chips('mis-dif', Object.assign({ todos:'Todas' }, ...[1,2,3,4,5].map(d => ({ [d]: `${d} ${DIFICULDADES[d].nome}` }))), filtroMissoes.dif)],
      ['Recompensa', chips('mis-rec', { todos:'Qualquer', itens:'Itens', magias:'Magias', pericias:'Perícias' }, filtroMissoes.recompensa)],
      ['Situação', chips('mis-st', { todos:'Todas', abertas:'Em aberto', feitas:'Concluídas' }, filtroMissoes.status)]], contaAtivos(filtroMissoes))}
    <div id="lista-comp">${listaMissoes()}</div>`;
}
function listaMissoes(){
  const b = semAcento(filtroMissoes.busca.trim()), f = filtroMissoes;

    (f.recompensa === 'todos' || (ms.recompensas[f.recompensa] || []).length) &&
    (f.status === 'todos' || (f.status === 'feitas') === missoesFeitas.has(ms.id)) &&

    <p class="meta-missao">${estrelas(ms.dificuldade)} · 📍 ${esc(ms.lugar)} · 🗣️ ${esc(ms.npc.nome)}${missoesFeitas.has(ms.id) ? ' · <b>✓ concluída</b>' : ''}</p>

    <div class="fontes"><b>Recompensas:</b> ${recompensasTxt(ms).join(' · ')}</div>
  </section>`).join('');
}
function abrirMissao(id, origem){

        <div>${realce(esc(e.texto))}</div>

/* ----- Dungeons ----- */
const LS_DUNGEONS = 'rpgHex_dungeons';
let estDungeons = lsGet(LS_DUNGEONS, {}) || {};
let dungeonAberta = null, salaSel = null, ultimoEvento = null;
const filtroDungeons = { tipo:'todos', dif:'todos' };
function estDg(id){ if (!estDungeons[id]) estDungeons[id] = { visitadas:[], reveladas:[], resolvidas:[], atual:null, mestre:false }; return estDungeons[id]; }
function salvarDg(){ lsSet(LS_DUNGEONS, estDungeons); }
const dungeon = id => DUNGEONS.find(x => x.id === id) || null;
function vizinhos(dg, sid){ return dg.conexoes.filter(c => c[0] === sid || c[1] === sid).map(c => ({ id: c[0] === sid ? c[1] : c[0], rot: c[2] || '' })); }
function salaVisivel(dg, sala, st){
  if (st.mestre) return 'mestre';
  if (st.visitadas.includes(sala.id)) return 'visitada';
  if (sala.oculta && !st.reveladas.includes(sala.id)) return null;
  if (sala.tipo === 'entrada' && !st.visitadas.length) return 'conhecida';
  return vizinhos(dg, sala.id).some(v => st.visitadas.includes(v.id)) ? 'conhecida' : null;
}
function rDungeons(){
  if (dungeonAberta) return rExplorar(dungeon(dungeonAberta));
  const lista = DUNGEONS.filter(dg => (filtroDungeons.tipo === 'todos' || dg.tipo === filtroDungeons.tipo) && (filtroDungeons.dif === 'todos' || String(dg.dificuldade) === filtroDungeons.dif))
    .sort((a, b) => a.nivel - b.nivel);
  return abasMis() + `<p class="intro">Lugares para explorar sala por sala, com inimigos, tesouros, armadilhas, bênçãos, maldições e segredos sobre o passado. O mapa se revela conforme o grupo avança.</p>
    ${painelFiltros('dungeons', '', [
      ['Tipo', chips('dg-tipo', Object.assign({ todos:'Todos' }, ...Object.entries(TIPOS_DUNGEON).map(([k, t]) => ({ [k]: `${t.ic} ${t.nome}` }))), filtroDungeons.tipo)],
      ['Dificuldade', chips('dg-dif', Object.assign({ todos:'Todas' }, ...[1,2,3,4,5].map(d => ({ [d]: `${d} ${DIFICULDADES[d].nome}` }))), filtroDungeons.dif)]], contaAtivos(filtroDungeons))}
    ${lista.length ? lista.map(dg => { const st = estDg(dg.id), total = dg.salas.length;
      return `<section class="bloco missao-card"><h2><button class="nome-missao" data-dungeon="${dg.id}">${TIPOS_DUNGEON[dg.tipo].ic} ${esc(dg.nome)}</button> <small>nv ${dg.nivel}+</small></h2>
        <p class="meta-missao">${estrelas(dg.dificuldade)} · ${TIPOS_DUNGEON[dg.tipo].nome} · 📍 ${esc(dg.lugar)} · ${total} salas${st.visitadas.length ? ` · <b>${st.visitadas.length} exploradas</b>` : ''}</p>
        <p>${esc(dg.descricao)}</p>
        <p class="etapas-ic">${[...new Set(dg.salas.map(sl => sl.tipo))].map(t => `<span title="${TIPOS_SALA[t].nome}">${TIPOS_SALA[t].ic}</span>`).join(' ')}</p>
        <button class="btn" data-dungeon="${dg.id}">${st.visitadas.length ? 'Continuar exploração' : 'Explorar'}</button></section>`; }).join('')
      : '<section class="bloco"><p class="vazio">Nenhuma dungeon com esses filtros.</p></section>'}`;
}
function mapaDungeon(dg, st){
  const W = 118, H = 84, bw = 100, bh = 58;
  const xs = dg.salas.map(sl => sl.x), ys = dg.salas.map(sl => sl.y);
  const minX = Math.min(...xs), minY = Math.min(...ys), maxX = Math.max(...xs), maxY = Math.max(...ys);
  const px = sl => (sl.x - minX) * W + 10, py = sl => (sl.y - minY) * H + 10;
  const vis = {}; dg.salas.forEach(sl => vis[sl.id] = salaVisivel(dg, sl, st));
  const porId = id => dg.salas.find(sl => sl.id === id);
  let linhas = '';
  dg.conexoes.forEach(c => {
    const a = porId(c[0]), b = porId(c[1]); if (!vis[a.id] || !vis[b.id]) return;
    const secreta = a.oculta || b.oculta;
    linhas += `<line x1="${px(a) + bw / 2}" y1="${py(a) + bh / 2}" x2="${px(b) + bw / 2}" y2="${py(b) + bh / 2}" class="dg-linha${secreta ? ' secreta' : ''}"/>`;
  });
  let salas = '';
  dg.salas.forEach(sl => {
    const v = vis[sl.id]; if (!v) return;
    const conhecido = v === 'visitada' || v === 'mestre', atual = st.atual === sl.id, sel = salaSel === sl.id;
    const cls = `dg-sala ${v}${atual ? ' atual' : ''}${sel ? ' sel' : ''}${st.resolvidas.includes(sl.id) ? ' resolvida' : ''}${sl.oculta ? ' oculta' : ''}`;
    const nome = sl.nome.length > 15 ? sl.nome.slice(0, 14) + '…' : sl.nome;
    salas += `<g class="${cls}" data-sala="${sl.id}" tabindex="0" role="button" aria-label="${esc(conhecido ? sl.nome : 'Sala desconhecida')}">
      <rect x="${px(sl)}" y="${py(sl)}" width="${bw}" height="${bh}" rx="8"/>
      <text x="${px(sl) + bw / 2}" y="${py(sl) + 24}" class="dg-ic">${conhecido ? TIPOS_SALA[sl.tipo].ic : '?'}</text>
      <text x="${px(sl) + bw / 2}" y="${py(sl) + 46}" class="dg-nome">${conhecido ? esc(nome) : '???'}</text>
      ${st.resolvidas.includes(sl.id) ? `<text x="${px(sl) + bw - 12}" y="${py(sl) + 16}" class="dg-ok">✓</text>` : ''}</g>`;
  });
  const largura = (maxX - minX) * W + bw + 20, altura = (maxY - minY) * H + bh + 20;
  return `<div class="dg-mapa-wrap"><svg class="dg-mapa" viewBox="0 0 ${largura} ${altura}" width="${largura}" height="${altura}" role="img" aria-label="Mapa da dungeon">${linhas}${salas}</svg></div>`;
}
function painelSala(dg, st){
  const sl = dg.salas.find(x => x.id === (salaSel || st.atual)); if (!sl) return `<section class="bloco"><p class="vazio">Toque na entrada 🚪 para começar.</p></section>`;
  const v = salaVisivel(dg, sl, st), conhecida = v === 'visitada' || v === 'mestre';
  const visitada = st.visitadas.includes(sl.id);
  const vz = vizinhos(dg, sl.id);
  const podeEntrar = !visitada && (sl.tipo === 'entrada' && !st.visitadas.length || vz.some(x => st.visitadas.includes(x.id)));
  if (!conhecida) return `<section class="bloco dg-painel"><h2>Sala desconhecida</h2><p>O grupo ainda não sabe o que há aqui.</p>
    ${podeEntrar ? `<button class="btn lacre" data-entrar="${sl.id}">Entrar</button>` : ''}</section>`;
  const t = sl.tesouro || {};
  const ocultosAqui = vz.filter(x => { const o = dg.salas.find(y => y.id === x.id); return o.oculta && !st.reveladas.includes(o.id); });
  const monBtn = mid => { const m = monstro(mid); return m ? `<button class="nome-magia" data-mon-info="${m.id}">${esc(m.nome)}</button> ${estrelas(m.dificuldade)}` : esc(mid); };
  return `<section class="bloco dg-painel etapa-${sl.tipo}"><h2>${TIPOS_SALA[sl.tipo].ic} ${esc(sl.nome)} <small>${TIPOS_SALA[sl.tipo].nome}${sl.oculta ? ', secreta' : ''}</small></h2>
    ${!visitada ? `<p class="nota">Visão do mestre: o grupo ainda não entrou aqui.</p>` : ''}
    <p>${realce(esc(sl.texto))}</p>
    ${(sl.inimigos || []).length ? `<p><b>Inimigos:</b> ${sl.inimigos.map(monBtn).join(', ')} <button class="btn pequeno simples" data-dg-batalha="${sl.id}">Levar para a batalha</button></p>` : ''}
    ${sl.teste ? `<p><b>Teste:</b> ${realce(esc(sl.teste))}. <b>Se falhar:</b> ${realce(esc(sl.falha))}</p>` : ''}
    ${sl.efeito ? `<p><b>Efeito:</b> ${realce(esc(sl.efeito))}</p>` : ''}
    ${sl.enigma ? `<div class="enigma"><b>Enigma:</b> ${esc(sl.enigma)}</div><details class="solucao"><summary>Solução (só o mestre)</summary><p>${esc(sl.solucao)}</p></details>` : ''}
    ${sl.segredo ? `<div class="segredo-passado"><b>📜 Segredo:</b> ${esc(sl.segredo)}</div>` : ''}
    ${(t.dinheiro || (t.itens || []).length) ? `<p><b>Tesouro:</b> ${[t.dinheiro ? `💰 ${moedas(t.dinheiro)}` : '', ...(t.itens || []).map(x => { const it = item(x.id); return it ? `${tierBadge(it.tier)} <button class="nome-magia" data-item-info="${it.id}">${esc(it.nome)}</button>${x.chance ? ` <small>${x.chance}%</small>` : ''}` : ''; })].filter(Boolean).join(' · ')}</p>` : ''}
    <p class="nota"><b>Saídas:</b> ${vz.filter(x => { const o = dg.salas.find(y => y.id === x.id); return !o.oculta || st.reveladas.includes(o.id) || st.mestre; }).map(x => { const o = dg.salas.find(y => y.id === x.id); const conh = st.visitadas.includes(o.id) || st.mestre;
      return `${conh ? esc(o.nome) : 'passagem desconhecida'}${x.rot ? ` (${esc(x.rot)})` : ''}`; }).join(', ') || 'nenhuma'}</p>
    <div class="botoes">
      ${podeEntrar ? `<button class="btn lacre" data-entrar="${sl.id}">Entrar</button>` : ''}
      ${visitada && st.atual !== sl.id ? `<button class="btn" data-entrar="${sl.id}">Ir para cá</button>` : ''}
      ${visitada ? `<button class="btn${st.resolvidas.includes(sl.id) ? ' simples' : ''}" data-resolver="${sl.id}">${st.resolvidas.includes(sl.id) ? 'Reabrir' : 'Marcar como resolvida'}</button>` : ''}
      ${visitada && ocultosAqui.length ? `<button class="btn simples" data-procurar="${sl.id}">🔍 Procurar passagem secreta</button>` : ''}
    </div>
    ${visitada && ocultosAqui.length ? `<p class="nota">Teste de PER (Percepção ou Investigação). Se passar, toque em Procurar para revelar a passagem.</p>` : ''}
  </section>`;
}
function rExplorar(dg){
  const st = estDg(dg.id);
  if (!salaSel) salaSel = st.atual || (dg.salas.find(sl => sl.tipo === 'entrada') || dg.salas[0]).id;
  const total = dg.salas.filter(sl => !sl.oculta).length, ocultas = dg.salas.filter(sl => sl.oculta).length;
  const exploradas = st.visitadas.length, chefe = dg.salas.find(sl => sl.tipo === 'chefe');
  const concluida = chefe && st.resolvidas.includes(chefe.id);
  return abasMis() + `<button class="btn pequeno simples" data-dungeon-voltar="1">← Todas as dungeons</button>
    <section class="bloco"><h2>${TIPOS_DUNGEON[dg.tipo].ic} ${esc(dg.nome)} <small>nv ${dg.nivel}+</small></h2>
      <p class="meta-missao">${estrelas(dg.dificuldade)} · ${TIPOS_DUNGEON[dg.tipo].nome} · 📍 ${esc(dg.lugar)}</p>
      <p>${esc(dg.descricao)}</p>
      <p class="meta-missao">Exploradas: <b>${exploradas}</b> de ${total}${ocultas ? ` (+ ${ocultas} ${ocultas === 1 ? 'sala secreta' : 'salas secretas'})` : ''}</p>
      <label class="dg-mestre"><input type="checkbox" data-dg-mestre="1"${st.mestre ? ' checked' : ''}> Visão do mestre (mostrar o mapa inteiro)</label>
    </section>
    ${mapaDungeon(dg, st)}
    <p class="nota" style="text-align:center">Toque numa sala para ver os detalhes. Salas com ? ainda não foram exploradas.</p>
    ${painelSala(dg, st)}
    <section class="bloco"><h2>Na exploração</h2>
      <div class="botoes"><button class="btn" data-dg-evento="1">🎲 Rolar evento (1d10)</button><button class="btn simples" data-dg-reiniciar="1">Reiniciar exploração</button></div>
      ${ultimoEvento && ultimoEvento.dg === dg.id ? `<div class="fontes" style="margin-top:10px"><b>Rolou ${ultimoEvento.d}:</b> ${esc(ultimoEvento.ev.texto)}${(ultimoEvento.ev.inimigos || []).length ? `<br><b>Inimigos:</b> ${ultimoEvento.ev.inimigos.map(i => `<button class="nome-magia" data-mon-info="${i}">${esc((monstro(i) || {}).nome || i)}</button>`).join(', ')}` : ''}</div>` : ''}
      <p class="nota">Role um evento sempre que o grupo passar muito tempo num lugar, descansar, ou fizer barulho.</p>
      ${concluida || st.mestre ? `<div class="segredo-passado"><b>📜 O segredo do passado:</b> ${esc(dg.segredoFinal)}</div>` : '<p class="nota">O segredo desta dungeon aparece quando o chefe for derrotado (marque a sala do chefe como resolvida).</p>'}
    </section>`;
}

const valorTxt = it => PRECOS_ITEM[it.tier] ? moedas(arredondaPreco(PRECOS_ITEM[it.tier] * fatorItem(it))) : '—';

function impRegras(){

      <li><b>Dano mágico</b> = (INT + foco + dado da magia) d10 × nível − DM do alvo. <b>Cura</b> = (FDV + foco + dado) d10 × nível.</li>
      <li><b>Ataques físicos por turno</b> = AGI (+1 arma muito leve, −1 escudo pesado). Arma muito pesada: 2 ações por ataque. <b>Ataques mágicos</b> = INT. <b>Reações</b> = ${R.reacoesBase} + evolução.</li>
      <li><b>Crítico</b>: d10 separado; 1 é crítico (${R.critBase}%), 1–2 com PER ${R.perLimiarCritico}+. Crítico = +${R.critBonusBase}% no dano final.</li>
      <li><b>Movimento</b> = ${R.movimentoBase} + AGI hex. <b>Carga</b> = ${R.cargaBase} + FOR × ${R.cargaPorFOR} kg; −1 movimento a cada ${R.pesoPorPenalidade} kg acima.</li>

      <li><b>Slots de magia</b> = INT × ${R.slotsPorINT}. Custo por tier: ${Object.entries(R.custoSlotPorTier).map(([k, v]) => `${TIERS[k].nome} ${v}`).join(', ')}. Usos por batalha, por dia ou por sessão.</li>
    </ul>
  </div>
  <div class="imp-col">

/* ================= Eventos ================= */
const conteudo = $('#conteudo');

document.querySelector('.abas').addEventListener('click', e => {
  const b = e.target.closest('button[data-aba]'); if (b) irPara(b.dataset.aba);
});
$('#abrir-menu').addEventListener('click', abrirMenu);
$('#btn-status').addEventListener('click', () => irPara('status'));
$('#fechar-menu').addEventListener('click', fecharMenu);
$('#veu').addEventListener('click', fecharMenu);
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('#modal-fundo').hidden) fecharModal(); else fecharMenu(); } });
$('#fechar-modal').addEventListener('click', () => fecharModal());
$('#modal-fundo').addEventListener('click', e => {
  if (e.target === e.currentTarget) { fecharModal(); return; }
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.filtro === 'modal-tier') { modalTier = b.dataset.valor; renderModal(); $('#modal-lista').scrollTop = 0; return; }
  if (b.dataset.ir) { fecharModal(); irPara(b.dataset.ir); return; }
  if (b.dataset.monInfo) { const m = monstro(b.dataset.monInfo); modalMagia = null; abrirMonstro({ id: m.id, nivel: P.nivel, dif: m.dificuldade }); return; }
  if (b.dataset.magiaInfo) { abrirMagia(b.dataset.magiaInfo); return; }
  if (b.dataset.itemInfo) { abrirItemInfo(b.dataset.itemInfo, b.dataset.loja); return; }
  if (b.dataset.periciaCat) { abrirPericiaCatalogo(b.dataset.periciaCat); return; }
  if (b.dataset.abrirPericias) { fecharModal(); subAbaHab = 'pericias'; irPara('habilidades'); return; }
  if (b.dataset.missaoInfo) { abrirMissao(b.dataset.missaoInfo); return; }
  if (b.dataset.missaoFeita) {
    const id = b.dataset.missaoFeita; missoesFeitas.has(id) ? missoesFeitas.delete(id) : missoesFeitas.add(id);
    lsSet(LS_MISSOES, [...missoesFeitas]); toast(missoesFeitas.has(id) ? 'Missão concluída' : 'Missão reaberta');
    const y = window.scrollY; render(); window.scrollTo(0, y); abrirMissao(id); return;
  }
  if (b.dataset.pcAcao) {
    const id = b.dataset.pc; alternarPericia(id, b.dataset.pcAcao);
    const y = window.scrollY; render(); window.scrollTo(0, y); abrirPericiaCatalogo(id); return;
  }
  if (b.dataset.mgUsar || b.dataset.mgDevolver || b.dataset.mgEquipar || b.dataset.mgRemover) { acaoMagia(b); return; }
  if (modalMon && acaoMonModal(b)) return;
  if (b.dataset.item !== undefined && modalSlot) equipar(modalSlot, b.dataset.item);
});
window.addEventListener('popstate', () => fecharModal(true));
$('#lista-menu').addEventListener('click', e => {
  const b = e.target.closest('[data-ir]'); if (!b) return;
  fecharMenu(); irPara(b.dataset.ir);
});

conteudo.addEventListener('click', e => {
  const g = e.target.closest('[data-sala]');
  if (g) { salaSel = g.dataset.sala; const y = window.scrollY; render(); window.scrollTo(0, y); const p = document.querySelector('.dg-painel'); if (p && p.scrollIntoView) p.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); return; }
  const t = e.target.closest('button'); if (!t) return;

  if (t.dataset.ir) { irPara(t.dataset.ir); return; }
  if (t.dataset.escolher) { abrirModal(t.dataset.escolher); return; }
  if (t.dataset.evoPontos) {
    P.pontosExtras = Math.max(0, P.pontosExtras + parseInt(t.dataset.evoPontos));
    const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if (t.dataset.evoAdd || t.dataset.evoRem) {
    const ev = evolucao(t.dataset.evoAdd || t.dataset.evoRem); if (!ev) return;
    const k = P.evolucao[ev.id] || 0;
    if (t.dataset.evoAdd) {
      const c = custoBolinha(ev, k), resta = pontosTotais() - pontosGastos();
      if (k >= REGRAS.evolucao.maxBolinhas || c > resta) return;
      P.evolucao[ev.id] = k + 1; toast(`${ev.nome}: bolinha ${k + 1} por ${fmt(c)} pontos`);
    } else if (k > 0) {
      const c = custoBolinha(ev, k - 1);
      if (k - 1) P.evolucao[ev.id] = k - 1; else delete P.evolucao[ev.id];
      toast(`${ev.nome}: ${fmt(c)} pontos devolvidos`);
    }
    const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if (t.dataset.nivel) { P.nivel = clamp(P.nivel + parseInt(t.dataset.nivel), 1, REGRAS.nivelMax); render(); return; }

  if (t.dataset.attr) {
    const id = t.dataset.attr, d = parseInt(t.dataset.d), a = ATRIBUTOS.find(x => x.id === id);
    const pt = pontos(a.grupo), v = P.atributos[id] + d;
    if (v < REGRAS.attrMin || v > REGRAS.attrMax || (d > 0 && pt.resta <= 0)) return;
    P.atributos[id] = v; render(); return;
  }

  if (t.dataset.limparFiltros) {
    const alvo = { itens: filtroItens, magias: filtroMagias, mon: filtroMon, pericias: filtroPericias, missoes: filtroMissoes, magiasEq: filtroMagiasEq, dungeons: filtroDungeons }[t.dataset.limparFiltros];
    Object.keys(alvo).forEach(k => { if (k !== 'busca') alvo[k] = 'todos'; });
    const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if (t.dataset.imprimir) { window.print(); return; }
  if (t.dataset.impTodas !== undefined) { if (t.dataset.impTodas === '1') Object.keys(SECOES_IMP).forEach(k => impSel.add(k)); else impSel.clear(); render(); return; }
  if (t.dataset.abrirPericias) { subAbaHab = 'pericias'; irPara('habilidades'); return; }
  if (t.dataset.info) { abrirInfo(t.dataset.info, t); return; }
  if (t.dataset.magiaInfo) { abrirMagia(t.dataset.magiaInfo, t); return; }
  if (t.dataset.itemInfo) { abrirItemInfo(t.dataset.itemInfo, t.dataset.loja, t); return; }
  if (t.dataset.periciaInfo) { abrirPericiaInfo(t.dataset.periciaInfo, t); return; }
  if (t.dataset.periciaCat) { abrirPericiaCatalogo(t.dataset.periciaCat, t); return; }
  if (t.dataset.missaoInfo) { abrirMissao(t.dataset.missaoInfo, t); return; }
  if (t.dataset.abrirDungeon) { subAbaMis = 'dungeons'; dungeonAberta = t.dataset.abrirDungeon; salaSel = null; irPara('missoes'); return; }
  if (t.dataset.subMis) { subAbaMis = t.dataset.subMis; dungeonAberta = null; salaSel = null; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.dungeon) { dungeonAberta = t.dataset.dungeon; salaSel = null; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.dungeonVoltar) { dungeonAberta = null; salaSel = null; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.entrar || t.dataset.resolver || t.dataset.procurar || t.dataset.dgEvento || t.dataset.dgReiniciar || t.dataset.dgBatalha) {
    const dg = dungeon(dungeonAberta), st = estDg(dg.id);
    if (t.dataset.entrar) { const id = t.dataset.entrar; if (!st.visitadas.includes(id)) st.visitadas.push(id); st.atual = id; salaSel = id; }
    else if (t.dataset.resolver) { const id = t.dataset.resolver; st.resolvidas = st.resolvidas.includes(id) ? st.resolvidas.filter(x => x !== id) : [...st.resolvidas, id]; }
    else if (t.dataset.procurar) { vizinhos(dg, t.dataset.procurar).forEach(v => { const o = dg.salas.find(y => y.id === v.id); if (o.oculta && !st.reveladas.includes(o.id)) { st.reveladas.push(o.id); toast(`Passagem secreta encontrada: ${o.nome}`); } }); }
    else if (t.dataset.dgEvento) { const n = Math.floor(Math.random() * 10) + 1; const ev = (EVENTOS_DUNGEON[dg.tipo] || []).find(e => n >= e.min && n <= e.max); ultimoEvento = { dg: dg.id, d: n, ev }; }
    else if (t.dataset.dgReiniciar) { if (!confirm('Reiniciar a exploração desta dungeon?')) return; delete estDungeons[dg.id]; salaSel = null; ultimoEvento = null; }
    else if (t.dataset.dgBatalha) {
      const sl = dg.salas.find(x => x.id === t.dataset.dgBatalha);
      (sl.inimigos || []).forEach(mid => { const m = monstro(mid); if (m) BATALHA.push({ uid: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), id: m.id, nivel: P.nivel, dif: m.dificuldade, dano: 0 }); });
      nomearInstancias(); salvarBatalha(); toast('Inimigos levados para a batalha no Bestiário'); return;
    }
    salvarDg(); const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if (t.dataset.subHab) { subAbaHab = t.dataset.subHab; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.pcAcao) { alternarPericia(t.dataset.pc, t.dataset.pcAcao); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (t.dataset.pcAdicionar) { const v = $('#pc-nova') && $('#pc-nova').value; if (v) { alternarPericia(v, 'aprender'); const y = window.scrollY; render(); window.scrollTo(0, y); } return; }
  if (t.dataset.monInfo) { const m = monstro(t.dataset.monInfo); abrirMonstro({ id: m.id, nivel: P.nivel, dif: m.dificuldade }, t); return; }
  if (t.dataset.monFicha) { abrirMonstro({ uid: t.dataset.monFicha }, t); return; }
  if (t.dataset.monRapido) {
    const m = monstro(t.dataset.monRapido);
    BATALHA.push({ uid: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), id: m.id, nivel: P.nivel, dif: m.dificuldade, dano: 0 });
    nomearInstancias(); salvarBatalha(); toast(`${m.nome} entrou na batalha, nível ${P.nivel}`); render(); window.scrollTo(0, 0); return;
  }
  if (t.dataset.monRem || t.dataset.monNv || t.dataset.monDano || t.dataset.monCura || t.dataset.monDrop) {
    const uid = t.dataset.monRem || t.dataset.monNv || t.dataset.monDano || t.dataset.monCura || t.dataset.monDrop;
    const b = BATALHA.find(x => x.uid === uid); if (!b) return;
    if (t.dataset.monRem) { BATALHA = BATALHA.filter(x => x.uid !== uid); nomearInstancias(); }
    else if (t.dataset.monNv) b.nivel = clamp(b.nivel + parseInt(t.dataset.d), 1, REGRAS.nivelMax);
    else if (t.dataset.monDrop) { sortearDrops(b); abrirInfo('drops', t); return; }
    else {
      const inp = document.querySelector(`.dano-input[data-uid="${uid}"]`), v = parseInt(inp && inp.value) || 0;
      if (!v) { toast('Digite um valor primeiro'); if (inp) inp.focus(); return; }
      const mon = monstro(b.id), max = calcMonstro(mon, b.nivel, b.dif).vida;
      const antes = (max - b.dano) / max * 100;
      b.dano = clamp(b.dano + (t.dataset.monDano ? v : -v), 0, max);
      const depois = (max - b.dano) / max * 100;
      const nova = (mon.fases || []).filter(f => f.abaixoDe < 100 && depois <= f.abaixoDe && antes > f.abaixoDe).sort((x, y) => x.abaixoDe - y.abaixoDe)[0];
      if (nova && depois > 0) toast(`⚡ ${b.nome} entrou na fase: ${nova.nome}!`);
      else toast(t.dataset.monDano ? `${b.nome} sofreu ${fmt(v)}` : `${b.nome} recuperou ${fmt(v)}`);
    }
    salvarBatalha(); const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if (t.dataset.batIgualar) { BATALHA.forEach(b => b.nivel = P.nivel); salvarBatalha(); toast(`Todos no nível ${P.nivel}`); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (t.dataset.batCurar) { BATALHA.forEach(b => b.dano = 0); salvarBatalha(); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (t.dataset.batLimpar) { if (!confirm('Encerrar a batalha e tirar todos os monstros?')) return; BATALHA = []; salvarBatalha(); render(); return; }
  if (t.dataset.usosReset) {
    const tipo = t.dataset.usosReset, zera = { batalha:['batalha'], dia:['batalha','dia'], sessao:['batalha','dia','sessao'] }[tipo];
    Object.keys(P.usosMagia).forEach(id => { const m = magia(id); if (m && zera.includes(m.usos.por)) delete P.usosMagia[id]; });
    toast({ batalha:'Usos por batalha restaurados', dia:'Usos por batalha e por dia restaurados', sessao:'Todos os usos restaurados' }[tipo]);
    const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if (t.dataset.rec) {
    const r = calcular(P); if (r.recursoMax == null) return;
    const v = t.dataset.rec;
    if (v === 'inicio') { P.recursoAtual = null; P.alvos = []; }
    else P.recursoAtual = clamp(r.recursoAtual + parseInt(v), 0, r.recursoMax);
    const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if (t.dataset.alvoAdd) {
    if (P.alvos.length < 12) P.alvos.push({ nome:'', marcas:0 });
    const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if (t.dataset.alvoRem !== undefined) {
    P.alvos.splice(parseInt(t.dataset.alvoRem), 1);
    const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if (t.dataset.marca !== undefined) {
    const a = P.alvos[parseInt(t.dataset.marca)], max = calcular(P).recursoMax; if (!a) return;
    const v = t.dataset.valor;
    a.marcas = v === 'todas' ? 0 : clamp(Math.min(a.marcas, max) + parseInt(v), 0, max);
    if (v === 'todas') toast(`Marcas de ${a.nome || 'inimigo'} consumidas`);
    const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if (t.dataset.habAdd || t.dataset.habRem) {
    const cls = classe(P.classe), hb = cls.habilidades.find(x => x.id === (t.dataset.habAdd || t.dataset.habRem)); if (!hb) return;
    if (t.dataset.habAdd) {
      const r = calcular(P);
      if (P.nivel < hb.nivel || r.pontosHab - r.pontosHabGastos < (hb.pontos || 1) || P.habilidades.includes(hb.id)) return;
      P.habilidades.push(hb.id); toast(`${hb.nome} aprendida`);
    } else {
      P.habilidades = P.habilidades.filter(x => x !== hb.id); toast(`${hb.nome} esquecida: 1 ponto devolvido`);
    }
    const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }

  if (t.dataset.filtro) {
    const v = t.dataset.valor;
    ({ 'itens-cat':() => filtroItens.cat = v, 'itens-tier':() => filtroItens.tier = v, 'itens-col':() => filtroItens.col = v,
       'magias-cat':() => filtroMagias.cat = v, 'pericias-attr':() => filtroPericias.attr = v, 'mis-reg':() => filtroMissoes.regiao = v, 'dg-tipo':() => filtroDungeons.tipo = v, 'dg-dif':() => filtroDungeons.dif = v, 'meq-cat':() => filtroMagiasEq.cat = v, 'meq-tier':() => filtroMagiasEq.tier = v, 'meq-ver':() => filtroMagiasEq.ver = v, 'mis-dif':() => filtroMissoes.dif = v, 'mis-rec':() => filtroMissoes.recompensa = v, 'mis-st':() => filtroMissoes.status = v, 'pericias-apr':() => filtroPericias.aprendidas = v, 'mon-dif':() => filtroMon.dif = v, 'mon-tipo':() => filtroMon.tipo = v, 'mon-origem':() => filtroMon.origem = v, 'mon-local':() => filtroMon.local = v, 'atlas-reg':() => atlasReg = v, 'magias-tier':() => filtroMagias.tier = v,
       'hab-classe':() => habClasse = v })[t.dataset.filtro]();
    const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }

  if (t.dataset.carregar) {
    const s = lsGet(LS_SALVOS, []).find(x => x.id === t.dataset.carregar);
    if (s) { P = normalizar(s); habClasse = null; irPara('status'); toast(`${P.nome || 'Personagem'} aberto`); }
    return;
  }

  if (t.dataset.apagar) {
    const salvos = lsGet(LS_SALVOS, []), s = salvos.find(x => x.id === t.dataset.apagar);
    if (!s || !confirm(`Apagar ${s.nome || 'este personagem'}? Isso não pode ser desfeito.`)) return;
    lsSet(LS_SALVOS, salvos.filter(x => x.id !== s.id));
    if (P.id === s.id) P.id = null;
    render(); toast('Personagem apagado'); return;
  }

  switch (t.dataset.acao) {
    case 'salvar': {
      const salvos = lsGet(LS_SALVOS, []);
      if (!P.id) P.id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const copia = JSON.parse(JSON.stringify(P)); copia.salvoEm = Date.now();
      const i = salvos.findIndex(x => x.id === P.id);
      i >= 0 ? salvos[i] = copia : salvos.push(copia);
      toast(lsSet(LS_SALVOS, salvos) ? 'Personagem salvo' : 'Não foi possível salvar neste navegador');
      render(); break;
    }
    case 'novo':
      if (!confirm('Criar um personagem novo? Mudanças não salvas nesta ficha serão perdidas.')) return;
      P = novo(); habClasse = null; irPara('ficha'); toast('Ficha em branco pronta'); break;
    case 'exportar': {
      const txt = JSON.stringify(lsGet(LS_SALVOS, []));
      const ta = $('#backup'); ta.value = txt; ta.select();
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast('Backup copiado'), () => toast('Backup pronto na caixa de texto'));
      else toast('Backup pronto na caixa de texto');
      break;
    }
    case 'importar': {
      try {
        const dados = JSON.parse($('#backup').value);
        if (!Array.isArray(dados)) throw new Error();
        const salvos = lsGet(LS_SALVOS, []);
        let novos = 0;
        dados.forEach(d => { const p = normalizar(d); if (!p.id) p.id = 'p' + Math.random().toString(36).slice(2, 10);
          p.salvoEm = d.salvoEm || Date.now();
          const i = salvos.findIndex(x => x.id === p.id); i >= 0 ? salvos[i] = p : (salvos.push(p), novos++); });
        lsSet(LS_SALVOS, salvos); render(); toast(`Importados: ${dados.length} (${novos} novos)`);
      } catch (err) { toast('Texto inválido: cole um backup exportado por este app'); }
      break;
    }
  }
});

conteudo.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.dgMestre) { estDg(dungeonAberta).mestre = t.checked; salvarDg(); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (t.dataset.impSec) { if (t.checked) impSel.add(t.dataset.impSec); else impSel.delete(t.dataset.impSec); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (t.id === 'imp-nivel') { impNivel = clamp(parseInt(t.value) || P.nivel, 1, REGRAS.nivelMax); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (t.id === 'evo-extras') { const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (t.id === 'f-classe') {
    if (P.habilidades.length && !confirm('Trocar de classe apaga as habilidades aprendidas. Continuar?')) { t.value = P.classe; return; }
    P.classe = t.value; habClasse = null; P.habilidades = []; P.recursoAtual = null; P.alvos = [];
    Object.keys(GRUPOS).forEach(g => {
      if (pontos(g).resta < 0) ATRIBUTOS.filter(a => a.grupo === g).forEach(a => P.atributos[a.id] = REGRAS.attrMin);
    });
    render(); return;
  }
  if (t.dataset.magia) {
    const id = t.dataset.magia;
    P.magias = t.checked ? [...new Set([...P.magias, id])] : P.magias.filter(x => x !== id);
    if (!t.checked) delete P.usosMagia[id];
    const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
});

conteudo.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'f-nome') { P.nome = t.value; atualizarTopo(); guardarRascunho(); return; }
  if (t.classList.contains('alvo-nome')) { const a = P.alvos[parseInt(t.dataset.idx)]; if (a) { a.nome = t.value; guardarRascunho(); } return; }
  if (t.classList.contains('dano-input')) { t.value = t.value.replace(/\D/g, ''); return; }
  if (t.id === 'evo-extras') {
    t.value = t.value.replace(/\D/g, '');
    P.pontosExtras = parseInt(t.value) || 0; guardarRascunho(); return;
  }
  if (t.id === 'busca-itens') { filtroItens.busca = t.value; $('#lista-comp').innerHTML = listaItens(); return; }
  if (t.id === 'busca-missoes') { filtroMissoes.busca = t.value; $('#lista-comp').innerHTML = listaMissoes(); return; }
  if (t.id === 'busca-magias-eq') { filtroMagiasEq.busca = t.value; $('#lista-magias-eq').innerHTML = listaMagiasEq(); return; }
  if (t.id === 'busca-pericias') { filtroPericias.busca = t.value; $('#lista-comp').innerHTML = listaPericias(); return; }
  if (t.id === 'busca-mon') { filtroMon.busca = t.value; $('#lista-mon').innerHTML = listaMonstros(); return; }
  if (t.id === 'busca-magias') { filtroMagias.busca = t.value; $('#lista-comp').innerHTML = listaMagias(); return; }
});

conteudo.addEventListener('toggle', e => { const dt = e.target; if (dt.classList && dt.classList.contains('det-filtros')) filtrosAbertos[dt.dataset.pag] = dt.open; }, true);
const btnTopo = document.createElement('button');
btnTopo.className = 'btn-topo'; btnTopo.hidden = true; btnTopo.setAttribute('aria-label', 'Voltar ao topo'); btnTopo.textContent = '↑';
document.body.appendChild(btnTopo);
btnTopo.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
window.addEventListener('scroll', () => { btnTopo.hidden = window.scrollY < 700; }, { passive: true });
window.addEventListener('resize', () => document.documentElement.style.setProperty('--topo', $('#topo').offsetHeight + 'px'));

render();
})();
